[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-relay-monitor"
version = "1.0.0"
description = "A tiny TCP relay that accounts every connection and turns its access log into a traffic report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ABU BAKAR SIDDIQUE", email = "abs2003.edu@gmail.com" }]
keywords = ["tcp", "proxy", "relay", "observability", "networking"]
dependencies = []

[project.scripts]
tcp-relay = "tcp_relay_monitor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
